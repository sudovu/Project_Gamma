name: Build Multi-Platform Artifacts (Android, iOS & Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 🍎 AUTOMATED MACOS RUNNER FOR IOS IPA CREATION
  build-ios:
    name: Build iOS IPA Package (macOS Runner)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15+
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || true
          xcodebuild -version

      - name: Build Unsigned Release Archive
        run: |
          xcodebuild archive \
            -project ios/GamaMusic.xcodeproj \
            -scheme GamaMusic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/GamaMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into IPA for Sideloading
        run: |
          mkdir -p build/Payload
          cp -r build/GamaMusic.xcarchive/Products/Applications/GamaMusic.app build/Payload/
          cd build
          zip -qr GAMA-v1.0.ipa Payload/
          ls -lh GAMA-v1.0.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAMA-v1.0-iOS-IPA
          path: build/GAMA-v1.0.ipa
          retention-days: 30

  # 💻 AUTOMATED WINDOWS RUNNER FOR EXE INSTALLER CREATION
  build-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Package Executable
        run: |
          cd windows
          npm ci || npm install
          npm run dist

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAMA-Windows-Installer
          path: |
            windows/release/*.exe
          retention-days: 30

  # 🤖 AUTOMATED UBUNTU RUNNER FOR ANDROID APK CREATION
  build-android:
    name: Build Android APK Package (Ubuntu Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAMA-v2.3-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

